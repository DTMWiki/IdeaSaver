# Dependabot for IdeaSaver monorepo
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Go modules (backend + CLI share root go.mod)
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    target-branch: dev
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore(deps)"
    groups:
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
      golang-x:
        patterns:
          - "golang.org/x/*"

  # Frontend (Vite + React + Ant Design)
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    target-branch: dev
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "chore(deps)"
    # Keep lockfile updates clean; ignore pure peer noise
    versioning-strategy: increase
    groups:
      fortawesome:
        patterns:
          - "@fortawesome/*"
      ant-design:
        patterns:
          - "antd"
          - "@ant-design/*"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
      vite-tooling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript"
          - "typescript-eslint"
          - "@types/*"
          - "eslint*"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    target-branch: dev
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
