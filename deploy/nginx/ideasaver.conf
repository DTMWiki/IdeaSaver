server {
    listen 80;
    server_name i.dtmwiki.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name i.dtmwiki.cn;

    # SSL certificates (managed by certbot or your CA)
    ssl_certificate     /etc/letsencrypt/live/i.dtmwiki.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i.dtmwiki.cn/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Upload size limit (match server config)
    client_max_body_size 10240m;

    # Proxy timeouts for large uploads
    proxy_connect_timeout 600s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # SSE support - disable buffering
    proxy_buffering off;

    # All requests go to Go server
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    # SSE endpoint - explicitly disable buffering
    location /api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;

        # Long timeout for SSE
        proxy_read_timeout 86400s;
    }
}
